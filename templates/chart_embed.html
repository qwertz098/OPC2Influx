<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ cfg.name }}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--body-bg, #0f172a); color: var(--leg-text, #f1f5f9);
         font-family: system-ui, sans-serif; overflow: hidden; }
  #chart      { position: fixed; top: 0; left: 0; right: 0; bottom: 37px; }
  #legend-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bar-bg, #1e293b);
    border-top: 1px solid var(--bar-border, #334155);
    display: flex; flex-wrap: wrap; align-items: stretch;
    max-height: 50vh; overflow: hidden;
  }
  #legend { display: contents; }
  .leg-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px;
    min-width: 0;
  }
  .leg-swatch { width: 22px; height: 3px; border-radius: 2px; flex-shrink: 0; }
  .leg-name { font-size: 11px; color: var(--leg-text, #94a3b8); white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .leg-val  { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
              white-space: nowrap; min-width: 50px; text-align: right; }
  .leg-mul  { font-size: 10px; color: var(--leg-muted, #64748b); white-space: nowrap; }
  #leg-meta { margin-left: auto; display: flex; align-items: center; gap: 12px;
              padding: 5px 10px; font-size: 10px; color: var(--leg-text, #94a3b8);
              white-space: nowrap; flex-shrink: 0; }
  #leg-meta .cfg-name { font-weight: 500; }
</style>
</head>
<body>
<div id="chart"></div>
<div id="legend-bar">
  <div id="legend"></div>
  <div id="leg-meta">
    <span class="cfg-name">{{ cfg.name }}</span>
    <span id="status">connecting…</span>
  </div>
</div>
<script src="/static/vendor/echarts@5.min.js"></script>
<script>
const CFG = {{ cfg.model_dump() | tojson }};
const THEME = {{ theme | tojson }};
const STRIP_PREFIXES = {{ strip_prefixes | tojson }};
const SIGNALS = CFG.signals;
const MULTIPLIERS = CFG.multipliers || {};
const INTERVAL_MS = CFG.interval_ms || 1000;
const MAX_SEC = CFG.max_time_seconds || 0;
const LOG_TIME = !!CFG.log_time_mode;
const AUTO_SCALE = !!CFG.auto_scale_mode;
const MAX_PTS = 2000;

// ── Theme palette ─────────────────────────────────────────────────────────────
const THEMES = {
  dark:         { bg:'#0f172a', bar:'#1e293b', border:'#334155',
                  axis:'#94a3b8', split:'#1e293b', text:'#f1f5f9',
                  muted:'#64748b', shaded:false },
  dark_shaded:  { bg:'#0f172a', bar:'#1e293b', border:'#334155',
                  axis:'#94a3b8', split:'#1e293b', text:'#f1f5f9',
                  muted:'#64748b', shaded:true  },
  light:        { bg:'#ffffff', bar:'#f1f5f9', border:'#cbd5e1',
                  axis:'#475569', split:'#e2e8f0', text:'#0f172a',
                  muted:'#94a3b8', shaded:false },
  light_shaded: { bg:'#ffffff', bar:'#f1f5f9', border:'#cbd5e1',
                  axis:'#475569', split:'#e2e8f0', text:'#0f172a',
                  muted:'#94a3b8', shaded:true  },
};
const T = THEMES[THEME] || THEMES.dark;

// Apply CSS variables
const r = document.documentElement;
r.style.setProperty('--body-bg',   T.bg);
r.style.setProperty('--bar-bg',    T.bar);
r.style.setProperty('--bar-border',T.border);
r.style.setProperty('--leg-text',  T.axis);
r.style.setProperty('--leg-muted', T.muted);

const COLORS = [
  '#e6194b','#3cb44b','#4363d8','#f58231','#911eb4',
  '#42d4f4','#f032e6','#bfef45','#469990','#dcbeff',
];

SIGNALS.forEach((s, i) => { if (!s.color) s.color = COLORS[i % COLORS.length]; });

const buffers = new Map(SIGNALS.map(s => [s.server_id + '|' + s.node_id, []]));
let chart = null;
let seriesKeys = [];

function applyStrips(server_id, label) {
  const strips = STRIP_PREFIXES[server_id] || [];
  for (const s of strips) {
    if (s && label.startsWith(s)) {
      label = label.slice(s.length).replace(/^[./]+/, '');
    }
  }
  return label;
}

function sigLabel(s) {
  return applyStrips(s.server_id, s.label || s.name) || s.name;
}

function fmtVal(v) {
  if (v === null || v === undefined) return '—';
  if (Number.isInteger(v)) return String(v);
  const abs = Math.abs(v);
  if (abs === 0) return '0';
  if (abs >= 100000) return v.toFixed(0);
  if (abs >= 1000)   return v.toFixed(1);
  if (abs >= 1)      return v.toFixed(3);
  if (abs >= 0.01)   return v.toFixed(5);
  return v.toFixed(8);
}

function decimateBuffer(buf) {
  const half = Math.floor(buf.length / 2);
  const kept = buf.filter((_, i) => i >= half || i % 2 === 0);
  buf.length = 0; buf.push(...kept);
}

// Sliding window: drop points older than windowMs from the newest point.
function trimBuffer(buf, windowMs) {
  if (!buf.length) return;
  const cutoff = buf[buf.length - 1].t - windowMs;
  let i = 0;
  while (i < buf.length && buf[i].t < cutoff) i++;
  if (i > 0) buf.splice(0, i);
}

function buildSeries() {
  const nowMs = Date.now();
  seriesKeys = [];
  return SIGNALS.map(s => {
    const key = s.server_id + '|' + s.node_id;
    const buf = buffers.get(key) || [];
    const mul = MULTIPLIERS[key] || 1.0;
    const data = LOG_TIME
      ? buf.map(pt => [-Math.log10(nowMs - pt.t + 1), pt.v * mul])
      : buf.map(pt => [pt.t, pt.v * mul]);
    seriesKeys.push(key);
    return {
      id: key, name: sigLabel(s), type: 'line', showSymbol: false,
      lineStyle: {color: s.color, width: 1.5}, itemStyle: {color: s.color},
      areaStyle: T.shaded ? { color: s.color, opacity: 0.12 } : undefined,
      data,
    };
  });
}

// ── Legend ────────────────────────────────────────────────────────────────────
function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  SIGNALS.forEach(s => {
    const key = s.server_id + '|' + s.node_id;
    const mul = MULTIPLIERS[key] || 1.0;
    const buf = buffers.get(key) || [];
    const last = buf.length ? buf[buf.length - 1].v : null;

    const row = document.createElement('div');
    row.className = 'leg-row';
    row.dataset.legendKey = key;

    const swatch = document.createElement('span');
    swatch.className = 'leg-swatch';
    swatch.style.background = s.color;

    const name = document.createElement('span');
    name.className = 'leg-name';
    name.title = sigLabel(s);
    name.textContent = sigLabel(s);

    const val = document.createElement('span');
    val.className = 'leg-val';
    val.style.color = s.color;
    val.dataset.valKey = key;
    val.textContent = fmtVal(last);

    row.appendChild(swatch);
    row.appendChild(name);
    row.appendChild(val);

    if (mul !== 1.0) {
      const mulEl = document.createElement('span');
      mulEl.className = 'leg-mul';
      mulEl.textContent = '×' + (Number.isInteger(mul * 10) ? mul.toFixed(1) : mul);
      row.appendChild(mulEl);
    }

    el.appendChild(row);
  });
}

function updateLegendValues() {
  SIGNALS.forEach(s => {
    const key = s.server_id + '|' + s.node_id;
    const span = document.querySelector(`[data-val-key="${CSS.escape(key)}"]`);
    if (!span) return;
    const buf = buffers.get(key) || [];
    const last = buf.length ? buf[buf.length - 1].v : null;
    span.textContent = fmtVal(last);
  });
}

// ── Layout sync ───────────────────────────────────────────────────────────────
function _syncLegendHeight() {
  const legendH = document.getElementById('legend-bar').offsetHeight;
  const chartEl = document.getElementById('chart');
  chartEl.style.height = (window.innerHeight - legendH) + 'px';
  chartEl.style.width  = window.innerWidth + 'px';
  if (chart) chart.resize();
}
window.addEventListener('resize', _syncLegendHeight);

// ── Chart ─────────────────────────────────────────────────────────────────────
function initChart() {
  _syncLegendHeight();
  chart = echarts.init(document.getElementById('chart'));

  const xSplits = Math.max(2, Math.min(Math.floor(window.innerWidth / 120), 6));
  const ySplits = Math.max(2, Math.min(Math.floor(window.innerHeight / 80), 6));

  const xAxis = LOG_TIME ? {
    type: 'value', min: 'dataMin', max: -Math.log10(1001), inverse: false,
    splitNumber: xSplits,
    axisLabel: { color: T.axis, formatter: x => {
      const ms = Math.pow(10, -x) - 1;
      if (ms < 500) return '';
      if (ms < 90000) return Math.round(ms/1000)+'s';
      if (ms < 5400000) return Math.round(ms/60000)+'m';
      return Math.round(ms/3600000)+'h';
    }},
  } : { type: 'time', splitNumber: xSplits, axisLabel: { color: T.axis } };

  const tooltipFormatter = params => {
    if (!params.length) return '';
    const header = LOG_TIME
      ? (() => { const ms = Math.pow(10, -params[0].value[0])-1;
          return ms < 90000 ? Math.round(ms/1000)+'s ago' : Math.round(ms/60000)+'m ago'; })()
      : new Date(params[0].value[0]).toLocaleTimeString();
    return header + '<br>' + params.map(p => {
      const key = seriesKeys[p.seriesIndex] || '';
      const mul = MULTIPLIERS[key] || 1.0;
      return `<span style="color:${p.color}">●</span> ${p.seriesName}: <b>${fmtVal(p.value[1]/mul)}</b>`;
    }).join('<br>');
  };

  chart.setOption({
    animation: false,
    backgroundColor: T.bg,
    grid: { left: 60, right: 16, top: 16, bottom: 36 },
    tooltip: { trigger: 'axis', axisPointer: {type:'cross'}, formatter: tooltipFormatter,
               backgroundColor: T.bar, borderColor: T.border, textStyle: {color: T.text} },
    legend: { show: false },
    xAxis,
    yAxis: { type: 'value', axisLine: {show:true}, scale: AUTO_SCALE, splitNumber: ySplits,
             axisLabel: {color: T.axis}, splitLine: {lineStyle: {color: T.split}} },
    series: buildSeries(),
  }, true);
}

// ── Poll ─────────────────────────────────────────────────────────────────────
let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const payload = SIGNALS.map(s => ({server_id: s.server_id, node_id: s.node_id}));
    const resp = await fetch('/chart/read', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    const results = await resp.json();
    for (const r of results) {
      const key = r.server_id + '|' + r.node_id;
      if (r.v === null || !buffers.has(key)) continue;
      const buf = buffers.get(key);
      buf.push({t: r.t, v: r.v});
      if (MAX_SEC > 0) trimBuffer(buf, MAX_SEC * 1000);
      if (buf.length > MAX_PTS) decimateBuffer(buf);
    }
    if (!chart) { initChart(); buildLegend(); _syncLegendHeight(); }
    chart.setOption({series: buildSeries()});
    updateLegendValues();
    document.getElementById('status').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  } finally {
    polling = false;
  }
}

const timer = setInterval(poll, INTERVAL_MS);
poll();
</script>
</body>
</html>
