{# Saved views: Save, dropdown, Load, delete, and with embed=true the embed
   button and its info. Set save_title (and embed) before including. #}
<button class="btn btn-tool btn-sm" onclick="saveView()" title="{{ save_title }}">Save view</button>
<div style="display:flex;align-items:center;gap:.3rem">
  <select id="loadViewSel" class="input input-sm" style="width:auto;padding:.15rem .4rem;max-width:160px" onchange="_onViewSelChange()">
    <option value="">Select…</option>
  </select>
  <button id="loadViewBtn" class="btn btn-tool btn-sm" onclick="loadSelectedView()" title="Load selected view" disabled>Load</button>
  <button id="deleteViewBtn" class="btn btn-danger btn-sm" onclick="deleteSelectedView()" title="Delete selected view" disabled>✕</button>
  {% if embed %}
  <button id="openEmbedBtn" class="btn btn-tool btn-sm" onclick="openEmbedView()" title="Open the selected saved view as an embed in a new tab (select a saved view first)" disabled>↗</button>
  <span class="info-icon" title="Embed view appearance: add parameters joined by +&#10;Scheme: dark (default), light, medium, solarized-light, solarized-dark, system&#10;Look: studio (default), mono, contrast&#10;shaded: fill the area under the lines&#10;Example: /chart/embed/{id}/light+contrast+shaded"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.9" r="1" fill="currentColor"/><path d="M8 7.2v4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
  {% endif %}
</div>
