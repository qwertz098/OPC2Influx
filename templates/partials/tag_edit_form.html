<tr id="tag-edit-{{ tag.id }}">
  <td colspan="7" style="padding:12px;background:var(--surface-2,#f8fafc)">
    <form action="/config/tags/{{ tag.id }}/update" method="post">
      <div class="form-row" style="gap:8px;flex-wrap:wrap;align-items:flex-end">
        <div class="form-group">
          <label class="form-label">Display Name</label>
          <input class="input input-sm" type="text" name="name" value="{{ tag.name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Short Name</label>
          <input class="input input-sm" type="text" name="short_name" value="{{ tag.short_name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Tag Key</label>
          <input class="input input-sm" type="text" name="key" value="{{ tag.key }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="select select-sm" name="is_dynamic"
                  onchange="toggleTagFields(this, 'edit-{{ tag.id }}')">
            <option value="false" {% if not tag.is_dynamic %}selected{% endif %}>Static</option>
            <option value="true" {% if tag.is_dynamic %}selected{% endif %}>Dynamic</option>
          </select>
        </div>
        <div class="form-group" id="edit-{{ tag.id }}-static-group"
             style="{% if tag.is_dynamic %}display:none{% endif %}">
          <label class="form-label">Static Value</label>
          <input class="input input-sm" type="text" name="static_value" value="{{ tag.static_value }}">
        </div>
        <div class="form-group" id="edit-{{ tag.id }}-dynamic-group"
             style="{% if not tag.is_dynamic %}display:none{% endif %}">
          <label class="form-label">Relative Path</label>
          <input class="input input-sm" type="text" name="relative_path" value="{{ tag.relative_path }}"
                 placeholder="../RecipeName">
        </div>
        <div class="form-group">
          <label class="form-label">Default Active</label>
          <select class="select select-sm" name="default_active">
            <option value="true" {% if tag.default_active %}selected{% endif %}>Yes</option>
            <option value="false" {% if not tag.default_active %}selected{% endif %}>No</option>
          </select>
        </div>
        <div class="form-group" style="align-self:flex-end">
          <button type="submit" class="btn btn-primary btn-xs">Save</button>
          <button type="button" class="btn btn-ghost btn-xs"
                  onclick="document.getElementById('tag-edit-{{ tag.id }}').remove()">Cancel</button>
        </div>
      </div>
    </form>
  </td>
</tr>
