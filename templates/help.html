{% extends "base.html" %}
{% block title %}Opc2Influx{% endblock %}

{% block content %}
<style>
  .help-content {
    max-width: 860px;
    margin: 0 auto;
    line-height: 1.7;
    font-size: .92rem;
  }
  .help-content h1 { font-size: 1.7rem; margin: 2rem 0 .8rem; border-bottom: 2px solid var(--border); padding-bottom: .4rem; }
  .help-content h2 { font-size: 1.25rem; margin: 1.8rem 0 .6rem; border-bottom: 1px solid var(--border); padding-bottom: .3rem; }
  .help-content h3 { font-size: 1.05rem; margin: 1.4rem 0 .4rem; }
  .help-content p  { margin: .5rem 0; }
  .help-content ul, .help-content ol { margin: .4rem 0; padding-left: 1.6rem; }
  .help-content li { margin: .25rem 0; }
  .help-content code {
    background: var(--bg-muted, #f4f5f7);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: .88em;
  }
  .help-content pre {
    background: var(--bg-muted, #f4f5f7);
    padding: .8rem 1rem;
    border-radius: 6px;
    overflow-x: auto;
    font-size: .85rem;
    line-height: 1.5;
  }
  .help-content pre code {
    background: none;
    padding: 0;
  }
  .help-content table {
    border-collapse: collapse;
    width: 100%;
    margin: .8rem 0;
    font-size: .88rem;
  }
  .help-content th, .help-content td {
    border: 1px solid var(--border);
    padding: .4rem .7rem;
    text-align: left;
  }
  .help-content th {
    background: var(--bg-muted, #f4f5f7);
    font-weight: 600;
  }
  .help-content img {
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin: .8rem 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .help-content blockquote {
    border-left: 3px solid var(--primary, #4363d8);
    margin: .8rem 0;
    padding: .4rem .8rem;
    color: var(--text-muted);
    background: var(--bg-muted, #f4f5f7);
    border-radius: 0 4px 4px 0;
  }
  .help-content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.5rem 0;
  }
</style>

<div class="help-content">
  {{ readme_html | safe }}
</div>
{% endblock %}
